<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1208">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇫🇷</text></svg>">
<title>Apprends le français</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #f0d080;
    --dark: #1a1208;
    --dark2: #2b1f0a;
    --mid: #3d2e10;
    --cream: #f7f0e0;
    --cream2: #ede4cc;
    --red: #c0392b;
    --green: #27ae60;
    --shadow: 0 8px 32px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--dark);
    color: var(--cream);
    min-height: 100vh;
    background-image: 
      radial-gradient(ellipse at 20% 20%, #3d2e1040 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, #c9a84c15 0%, transparent 60%);
  }

  header {
    position: relative;
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
    border-bottom: 1px solid #c9a84c30;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 6vw, 3.5rem);
    color: var(--gold);
    letter-spacing: 0.04em;
    line-height: 1.1;
  }

  header p {
    color: #a89060;
    font-size: 0.95rem;
    margin-top: 0.5rem;
    font-weight: 300;
  }

  /* SCORE BAR */
  .scorebar {
    display: flex;
    justify-content: center;
    gap: 2rem;
    padding: 1rem;
    font-size: 0.9rem;
    color: #a89060;
  }

  .scorebar span { color: var(--gold); font-weight: 500; font-size: 1.1rem; }

  /* TABS */
  nav {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    padding: 1rem;
    flex-wrap: wrap;
  }

  nav button {
    background: var(--dark2);
    border: 1px solid #c9a84c40;
    color: #a89060;
    padding: 0.55rem 1.2rem;
    border-radius: 2rem;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    transition: all 0.2s;
  }

  nav button.active, nav button:hover {
    background: var(--gold);
    color: var(--dark);
    border-color: var(--gold);
    font-weight: 500;
  }

  /* MAIN CARD */
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 1rem 1.5rem 3rem;
  }

  .section { display: none; animation: fadeIn 0.3s ease; }
  .section.active { display: block; }

  @keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }

  .card {
    background: var(--dark2);
    border: 1px solid #c9a84c25;
    border-radius: 1.2rem;
    padding: 2rem;
    margin-bottom: 1.5rem;
    box-shadow: var(--shadow);
  }

  .exercise-label {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--gold);
    margin-bottom: 0.4rem;
  }

  .exercise-question {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--cream);
    margin-bottom: 1.2rem;
    line-height: 1.3;
  }

  .exercise-hint {
    font-size: 0.82rem;
    color: #7a6840;
    margin-bottom: 1rem;
    font-style: italic;
  }

  input[type="text"] {
    width: 100%;
    background: var(--dark);
    border: 1.5px solid #c9a84c40;
    border-radius: 0.6rem;
    padding: 0.85rem 1.1rem;
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus { border-color: var(--gold); }
  input[type="text"].correct { border-color: var(--green); background: #1a3320; }
  input[type="text"].wrong { border-color: var(--red); background: #2e1010; }

  .gap-sentence {
    font-size: 1.15rem;
    line-height: 2.2;
    color: var(--cream);
    margin-bottom: 1rem;
  }

  .gap-sentence input {
    width: auto;
    min-width: 120px;
    display: inline-block;
    padding: 0.2rem 0.6rem;
    font-size: 1rem;
  }

  /* BUTTONS */
  .btn {
    background: var(--gold);
    color: var(--dark);
    border: none;
    padding: 0.7rem 1.8rem;
    border-radius: 2rem;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 0.95rem;
    transition: all 0.2s;
    margin-top: 1rem;
  }

  .btn:hover { background: var(--gold-light); transform: translateY(-1px); }

  .btn-secondary {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    margin-left: 0.8rem;
  }

  .btn-secondary:hover { background: var(--gold); color: var(--dark); }

  /* FEEDBACK */
  .feedback {
    margin-top: 1rem;
    padding: 0.8rem 1rem;
    border-radius: 0.6rem;
    font-size: 0.92rem;
    display: none;
  }

  .feedback.show { display: block; }
  .feedback.correct { background: #1a3320; border: 1px solid var(--green); color: #5dde90; }
  .feedback.wrong { background: #2e1010; border: 1px solid var(--red); color: #e87070; }

  /* PROGRESS */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--mid);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .progress-text { font-size: 0.8rem; color: #7a6840; white-space: nowrap; }

  /* VERB TABLE */
  .verb-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 0.5rem;
  }

  .verb-table td, .verb-table th {
    padding: 0.6rem 0.8rem;
    border-bottom: 1px solid #c9a84c15;
    font-size: 0.95rem;
  }

  .verb-table th {
    color: var(--gold);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 400;
    text-align: left;
  }

  .verb-table td:first-child { color: #a89060; width: 80px; }

  .verb-table input {
    width: 100%;
    padding: 0.3rem 0.6rem;
    font-size: 0.95rem;
  }

  /* MULTI CHOICE */
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-top: 0.5rem;
  }

  .option-btn {
    background: var(--dark);
    border: 1.5px solid #c9a84c30;
    color: var(--cream);
    padding: 0.8rem 1rem;
    border-radius: 0.7rem;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    text-align: left;
    transition: all 0.2s;
  }

  .option-btn:hover { border-color: var(--gold); color: var(--gold); }
  .option-btn.correct { background: #1a3320; border-color: var(--green); color: #5dde90; }
  .option-btn.wrong { background: #2e1010; border-color: var(--red); color: #e87070; }
  .option-btn.reveal { border-color: var(--green); color: var(--green); }

  /* FLASH CARD */
  .flashcard {
    perspective: 1000px;
    height: 200px;
    cursor: pointer;
    margin-bottom: 1rem;
  }

  .flashcard-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s;
  }

  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

  .flashcard-front, .flashcard-back {
    position: absolute;
    inset: 0;
    background: var(--mid);
    border: 1px solid #c9a84c30;
    border-radius: 1rem;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }

  .flashcard-back { transform: rotateY(180deg); background: #2d1f05; }

  .flashcard-front .lang { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--gold); margin-bottom: 0.8rem; }
  .flashcard-front .word { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--cream); }
  .flashcard-back .word { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); }
  .flashcard-back .hint { font-size: 0.85rem; color: #a89060; margin-top: 0.5rem; }

  /* RESULTS */
  .results-section {
    text-align: center;
    padding: 2rem;
  }

  .big-score {
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    color: var(--gold);
  }

  @media (max-width: 500px) {
    .options-grid { grid-template-columns: 1fr; }
    nav button { font-size: 0.8rem; padding: 0.5rem 0.9rem; }
    .exercise-question { font-size: 1.2rem; }
  }

  /* ===== LLIBRE (exercicis del llibre) ===== */
  .lb-intro { font-size: 0.85rem; color: #a89060; margin-bottom: 1rem; line-height: 1.5; }
  .lb-tools { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .lb-search { flex: 1 1 200px; min-width: 0; font-size: 15px; padding: 0.6rem 0.9rem; border-radius: 0.6rem; border: 1.5px solid #c9a84c40; background: var(--dark); color: var(--cream); font-family: inherit; outline: none; }
  .lb-search:focus { border-color: var(--gold); }
  .lb-filters, .lb-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .lb-filter, .lb-chip { font-size: 0.8rem; padding: 0.35rem 0.8rem; border-radius: 2rem; border: 1px solid #c9a84c40; background: var(--dark2); color: #a89060; cursor: pointer; font-family: inherit; }
  .lb-filter.on, .lb-chip.on { background: var(--gold); border-color: var(--gold); color: var(--dark); font-weight: 500; }
  .lb-chips { margin: 0.6rem 0 0.4rem; }
  .lb-chip-n { opacity: .7; margin-left: 2px; }
  .lb-index { margin-bottom: 1rem; }
  .lb-idx-group { font-size: 0.75rem; letter-spacing: .12em; color: var(--gold); margin: 16px 0 6px; text-transform: uppercase; }
  .lb-idx-lesson { background: var(--dark2); border: 1px solid #c9a84c25; border-radius: 0.8rem; margin-bottom: 6px; }
  .lb-sum { list-style: none; cursor: pointer; padding: 10px 12px; display: flex; gap: 8px; align-items: baseline; }
  .lb-sum::-webkit-details-marker { display: none; }
  details.lb-idx-lesson > .lb-sum::before { content: '▸'; color: #a89060; }
  details.lb-idx-lesson[open] > .lb-sum::before { content: '▾'; }
  .lb-soon { opacity: .45; } .lb-soon .lb-sum { cursor: default; padding-left: 26px; }
  .lb-idx-id { font-weight: 700; color: var(--gold); min-width: 1.4em; }
  .lb-idx-name { flex: 1; font-size: 0.92rem; color: var(--cream); }
  .lb-idx-theme { font-size: 0.75rem; color: #a89060; margin-left: 4px; }
  .lb-idx-prog { font-size: 0.75rem; color: #a89060; white-space: nowrap; }
  .lb-idx-desc { font-size: 0.82rem; color: #b8a478; padding: 0 12px 8px 30px; line-height: 1.45; }
  .lb-idx-open { margin: 0 12px 8px 30px !important; }
  .lb-idx-ex { display: block; width: 100%; text-align: left; background: none; border: none; border-top: 1px solid #c9a84c20; padding: 8px 12px 8px 30px; cursor: pointer; font-family: inherit; color: var(--cream); }
  .lb-idx-ex:hover { background: #3d2e1060; }
  .lb-idx-ex-t { font-size: 0.9rem; font-weight: 500; }
  .lb-idx-ex-i { font-size: 0.75rem; color: #a89060; margin-top: 2px; }
  .lb-tag { display: inline-block; font-size: 0.68rem; padding: 1px 7px; border-radius: 2rem; background: #c9a84c25; color: var(--gold-light); margin-left: 6px; vertical-align: 1px; }
  .lb-res-head { font-size: 0.82rem; color: #a89060; margin: 4px 0 8px; }
  .lb-lesson-head { margin: 1rem 0; }
  .lb-lesson-title { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: var(--cream); }
  .lb-lesson-sub { font-size: 0.75rem; color: var(--gold); letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
  .lb-lesson-goal { font-size: 0.85rem; color: #b8a478; font-style: italic; margin-top: 4px; }
  .lb-print-link { margin-left: 14px; }
  #lbPrintFab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 9999; display: none; align-items: center; gap: 6px; padding: 12px 18px; background: var(--gold); color: var(--dark); border: none; border-radius: 999px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,0,0,0.35); cursor: pointer; }
  body.lb-on #lbPrintFab { display: flex; }
  .lb-back { background: none; border: none; color: var(--gold); font-size: 0.82rem; cursor: pointer; padding: 0; margin-top: 6px; font-family: inherit; }
  .lb-card { background: var(--dark2); border: 1px solid #c9a84c25; border-radius: 1rem; padding: 1rem 1.1rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
  .lb-card.lb-flash { outline: 2px solid var(--gold); }
  .lb-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .lb-card-title { font-size: 0.95rem; font-weight: 500; color: var(--gold); }
  .lb-score { font-size: 0.75rem; color: #a89060; white-space: nowrap; }
  .lb-score.done { color: #4ade80; }
  .lb-instr { font-size: 0.8rem; color: #a89060; margin: 4px 0 8px; font-style: italic; }
  .lb-item { padding: 8px 0; border-top: 1px solid #c9a84c18; font-size: 0.98rem; color: var(--cream); line-height: 1.9; }
  .lb-item:first-of-type { border-top: none; }
  .lb-q { margin-right: 6px; }
  .lb-opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .lb-opt { background: var(--dark); color: var(--cream); border: 1px solid #c9a84c40; border-radius: 0.5rem; font-size: 0.9rem; padding: 0.4rem 0.7rem; cursor: pointer; font-family: inherit; }
  .lb-opt:hover:not(:disabled) { border-color: var(--gold); }
  .lb-opt:disabled { cursor: default; }
  .lb-opt:disabled:not(.ok):not(.bad) { opacity: .45; }
  .lb-opt.ok, .lb-gap.ok { background: #1a3320; border-color: var(--green); color: #c8f7d4; }
  .lb-opt.bad, .lb-gap.bad { background: #2e1010; border-color: var(--red); color: #f5c4c0; }
  .lb-opt.bad { text-decoration: line-through; }
  .lb-gap { font-size: 0.95rem; padding: 2px 6px; border: 1.5px solid #c9a84c40; border-radius: 0.4rem; background: var(--dark); color: var(--cream); font-family: inherit; max-width: 100%; outline: none; }
  .lb-gap:focus { border-color: var(--gold); }
  .lb-fix { color: #4ade80; font-size: 0.82rem; margin-left: 6px; }
  .lb-qes { display: block; font-size: 0.85rem; color: #a89060; font-style: italic; margin-top: 3px; }
  .lb-say { background: #c9a84c25; color: var(--gold-light); border: none; border-radius: 0.4rem; padding: 2px 8px; font-size: 0.9rem; margin-right: 6px; cursor: pointer; }
  .lb-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .lb-btn { padding: 0.45rem 1rem; border-radius: 2rem; border: 1px solid var(--gold); background: transparent; color: var(--gold); font-size: 0.82rem; font-weight: 500; cursor: pointer; font-family: inherit; }
  .lb-btn.lb-primary { background: var(--gold); color: var(--dark); }
  @media (max-width: 500px) { .lb-card { padding: 0.9rem; } .lb-idx-desc, .lb-idx-ex { padding-left: 14px; } .lb-idx-open { margin-left: 14px !important; } }

    /* ===== IMPRESSIÓ: fons blanc, sense tallar els exercicis ===== */
    @media print {
      @page { size: A4; margin: 12mm; }
      html, body { background: #fff !important; background-image: none !important; padding: 0 !important; margin: 0 !important; min-height: 0 !important; }
      body * { color: #111 !important; box-shadow: none !important; text-shadow: none !important; animation: none !important; transition: none !important; }
      #lbPrintFab, .lb-print-link, nav, .scorebar, .print-btn-wrap, .lb-tools, .lb-filters, .lb-index, .lb-chips, .lb-actions, .lb-back, .lb-say, .lb-intro, header .subtitle-none { display: none !important; }
      .card, .lb-card {
        background: #fff !important; border: 1px solid #999 !important; border-radius: 6px !important;
        break-inside: avoid; page-break-inside: avoid; margin: 0 0 10px !important; padding: 10px 12px !important;
      }
      .lb-item { break-inside: avoid; page-break-inside: avoid; border-top: 1px solid #ddd !important; line-height: 1.7 !important; }
      .lb-card-head, .lb-instr, .exercise-label { break-after: avoid; page-break-after: avoid; }
      .lb-opt {
        display: inline-block !important; background: #fff !important; border: 1px solid #888 !important;
        border-radius: 4px !important; padding: 2px 8px !important; margin: 2px 3px 2px 0 !important; font-size: 11pt !important; opacity: 1 !important;
      }
      .lb-opt.ok, .lb-gap.ok { background: #e3f6e8 !important; border-color: #2e7d32 !important; }
      .lb-opt.bad, .lb-gap.bad { background: #fdecea !important; border-color: #c62828 !important; }
      .lb-gap {
        display: inline-block !important; background: #fff !important; border: none !important; border-bottom: 1px solid #333 !important;
        border-radius: 0 !important; min-width: 90px; font-size: 11pt !important; -webkit-appearance: none; appearance: none;
      }
      .lb-lesson-head { break-after: avoid; page-break-after: avoid; margin: 0 0 8px !important; }
      .lb-qes { color: #666 !important; font-size: 9.5pt !important; line-height: 1.3 !important; }
    }
</style>

</head>
<body class="lb-on">

<header>
  <a href="index.html" style="position:absolute;left:14px;top:14px;color:#a89060;text-decoration:none;font-size:0.85rem;">← Accueil</a>
  <h1>Apprends le français</h1>
  <p>Exercices interactifs du cahier · pour hispanophones</p>
</header>

<main>
<button id="lbPrintFab" type="button" onclick="lbPrint()" aria-label="Imprimer">🖨️ Imprimer</button>

<div id="tab-livre" class="section active">
  <div class="exercise-label">📗 Le cahier d'exercices</div>
  <p class="lb-intro">Exercices des unités du cahier. Cherchez ce que vous voulez pratiquer, ouvrez l'index ou choisissez une unité. 🔊 lit à voix haute. Les activités avec audio du livre ne sont pas incluses.</p>
  <div class="lb-tools">
    <input id="lbSearch" class="lb-search" type="search" placeholder="🔍 Chercher : cause, grâce à, préfixes, causa, pronombre…" autocomplete="off">
    <button id="lbIndexBtn" class="lb-btn lb-primary" type="button">📑 Index</button>
    <button class="lb-btn" type="button" onclick="lbPrint()">🖨️ Imprimer</button>
  </div>
  <div class="lb-filters" id="lbFilters"></div>
  <div id="lbIndex" class="lb-index" style="display:none"></div>
  <div class="lb-chips" id="lbLessonChips"></div>
  <div id="lbLessonBody"></div>
</div>
</main>

<script>
/* ===== CAHIER : exercices du livre de français ===== */
(function () {
    const sh = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
    const gaps = list => list.map(([t, a, say]) => ({ t, a: [].concat(a), say }));
    const pick = (list, opts) => list.map(([q, a, say]) => ({ q, a, say, opts }));

    // ----- Index du cahier (9 unités) -----
    const UNITS = [
        [1, 'Ville en vie', 5, 14],
        [2, 'Ça ne tourne pas rond !', 15, 24],
        [3, 'En chair et en os', 25, 34],
        [4, "D'amour et d'amitié", 35, 44],
        [5, 'Au taf', 45, 54],
        [6, "L'art et la manière", 55, 64],
        [7, 'Sur le bout de la langue', 65, 74],
        [8, 'La règle du jeu', 75, 84],
        [9, "C'est trop drôle !", 85, 94],
    ].map(([n, title, page, end]) => ({ n, id: 'U' + n, title, page, end }));

    // Résumé en espagnol (aide à la recherche)
    const TOPICS = {

n calma de las consecuencias nocivas del «kilómetro alimentario». (con calma)","¡Evidentemente, los pesticidas son tóxicos para la salud humana! (Es evidente)","Conduce su tractor con prudencia por esta carretera estrecha. (de forma prudente)","El agricultor presentó su proyecto de permacultura de manera inteligente. (de manera inteligente)"],["escandaloso - indignante - inaceptable","admirable - excepcional - un ejemplo a seguir","fantástico - genial - magnífico","problemático - complicado - difícil","aterrador - espantoso - alarmante","útil - interesante - motivador"],["ARNOdu44: «Apoyo totalmente a estos alcaldes y su acción.»","Idriss@: «No les toca a los alcaldes tomar medidas sobre el uso de pesticidas.»","Popo_l'écolo: «Tienen toda la razón en actuar para proteger a sus vecinos.»","Kevin Lequellec: «Me parece justo que se anulen las medidas de los alcaldes.»","Frank_63: «He comprobado la toxicidad de los pesticidas. Es aterrador.»","Leila_santé: «¡Bravo por los alcaldes!»","Maire_du_17: «¡Es ilegal! Nuestro papel es administrar nuestros municipios.»","Doc_caro!: «Animo a los alcaldes a continuar su lucha.»"],["Malik y Annie crían una treintena de vacas lecheras.","Su rebaño se alimenta de forma natural con cereales cultivados en la zona.","Pierre y Albert crían al aire libre cerdos y aves de corral.","También cultivan un huerto.","En la familia de Vincent son pastores de padres a hijos.","Sus 60 ovejas viven en altura…","…en los pastos.","Apicultora apasionada desde hace casi treinta años, Rachel instaló sus 50 colmenas en la región en 2015.","Rachel instaló sus 50 colmenas en la región en 2015.","Sus abejas producen miel de acacia con certificado de Agricultura Ecológica."],["Tener un garbanzo en la cabeza","No tener ni un rábano","Poner el arado delante de los bueyes","Ser una gran verdura","Contar ensaladas","Tener corazón de alcachofa"],["El pescado se pesca, se limpia, se corta y se tritura en el barco.","La carne se prensa en planchas de 10 kilos.","Las le beber agua, té o café. (beber)","Es mejor que limitéis los caramelos, pasteles y galletas. (limitar)","Se recomienda poner un poco de especias. (poner)","Es indispensable que el plato contenga una mitad de verduras y frutas variadas. (contener)","Es absolutamente necesario que tomemos una cucharada de aceite de oliva o de colza. (tomar)","Es necesario comer un cuarto de cereales integrales o féculas. (comer)"],["Es importante que cada uno de nosotros contribuya a la protección del medio ambiente.","Cuando hacemos la compra, optamos por productos con la etiqueta Origen Francia.","La intensificación de los intercambios comerciales internacionales es responsable del aumento de los gases de efecto invernadero.","¡Reduciendo el consumo de carne, hacemos un gesto por el planeta!","Nuestra asociación exige la prohibición de los pesticidas más tóxicos.","A menudo, los menús de los comedores escolares no están adaptados a las distintas dietas de los alumnos.","Si los municipios practicaran el ecopastoreo, se evitaría el uso de pesticidas."],["la bajada","acelerar","el aumento","el estancamiento","la subida","frenar","una disminución","cada vez más","triplicar","mantenerse","cada vez menos","la caída"],["Las cifras muestran la parte de la población afectada por la inseguridad alimentaria en todos los continentes.","Hasta 2022, este porcentaje aumentó, afectando aproximadamente a más de una cuarta parte de la humanidad.","En 2024, en cambio, las curvas son diferentes.","Se observa una ligera desaceleración en América del Norte y en Europa, así como en Asia.","La bajada en América Latina y el Caribe es más significativa: pasa del 30 % al 25,2 %.","Al contrario, en África, la tasa sigue creciendo.","En 2024, más de la mitad de la población africana estaba afectada por la inseguridad alimentaria…","…aumentando la diferencia con los continentes norteamericano y europeo."],["En francés se pronuncian…","Para marcar la subjetividad, se insiste en unas sílabas, a menudo…","«Tu cuadro es un Van Gogh.» Para ser irónico, se…","«Has sacado un cero en francés. ¡Ah, bravo! ¡Genial!» Para ser irónico, se…","La ironía es…"],["¿Qué parte de la producción agrícola representa el arroz?","¿Qué parte de la cosecha se pierde?","¿Cuánto tiempo permite el saco conservar el arroz?"],["Étienne es ganadero de vacas lecheras.","Quiere responder a las críticas injustas contra los agricultores.","Sus vídeos tienen 3.000 visitas de media.","Su padre está en contra de sus vídeos."],["¿A qué distancia de las viviendas prohibió el alcalde los pesticidas?","¿Cuántas veces la dosis reglamentaria en un niño?","¿Quién puede prohibir los pesticidas en Francia?","¿Cuántos alcaldes tomaron medidas?"],["¿Adónde se envían los kiwis franceses?","¿Cuántos kilómetros recorren estos kiwis?","¿Por qué este rodeo por Italia?","¿Cuántos kilómetros puede recorrer el atún rojo?"],["La etiqueta «hecho en casa» garantiza que los platos están…","¿Cómo se llama el restaurante?","¿Dónde está Brachoua?","¿Gracias a qué técnica el pueblo se volvió autosuficiente?"]],"U3":[["Sinónimo de apariencia.","Modelo ideal de proporciones.","Concepción de lo bello, en el arte o en la naturaleza.","Características de la cara o de la personalidad.","Ideas a las que una sociedad da importancia (ideales morales o estéticos).","Sinónimo de modelo a seguir o de norma.","El volumen del cuerpo: su talla, su peso, su forma."],["Las estatuillas prehistóricas de Venus representaban mujeres de proporciones exageradas.","En el Antiguo Egipto se valoraban las siluetas armoniosas, delgadas y esbeltas.","La cara tenía que ser simétrica (ojos almendrados, nariz pequeña, etc.).","En el siglo XIX, la cintura fina se convierte en el ideal gracias a la moda del corsé.","La tez pálida evoca delicadeza.","En los años 1920, Coco Chanel lanza la moda de la piel bronceada.","Las redes sociales incitan a los jóvenes a recurrir a la cirugía estética…","…para modificar su apariencia."],["En la Antigüedad, el cuerpo musculoso era un la espalda no se ven. →"],["La semana pasada me quité un lunar.","Pauline se ha cortado el pelo muy corto.","Se dejaron arreglar el bigote antes de la boda.","Las dos cantantes se blanquearon los dientes para su concierto.","Se dejó poner uñas postizas.","Mis amigos, Charles y Gabriel, se quitan los tatuajes."],["Se fijaron en esta modelo por su físico atípico. →","La sonrisa de este hombre me sedujo. →","Unos fotógrafos molestaron a las estrellas. →","Un profesional maquilla y peina a muchas mujeres el día de su boda. →","Las redes sociales influyen demasiado en la gente. →"],["Hay más jóvenes (18-24 años) que personas mayores (50-60 años) que se operan.","Muchas chicas jóvenes se hinchan los labios por moda.","En los chicos, el uso de la cirugía se asume menos y, a menudo, la operación se oculta.","Muchos optan por implantes de pelo o se añaden vello en la cara.","Todos estos jóvenes están influidos por las redes sociales o los discursos de los influencers.","Están bombardeados con imágenes retocadas o embellecidas con filtros.","Algunas prácticas ilegales en Francia se practican en otros lugares.","Muchos franceses van al extranjero para limarse los dientes en forma de dientes de tiburón…","…y ponerse dientes de cerámica para tener una sonrisa «perfecta».","Una operación de cirugía estética, aunque la haga un profesional, tiene consecuencias y riesgos."],["Sylvain ha pasado más de 500 horas de sesiones de tatuaje.","Sylvain tuvo que ser hospitalizado después de su operación de ojos.","Sylvain ya tenía tatuajes cuando empezó a dar clases.","A Sylvain lo pueden despedir de su trabajo por su aspecto.","Sylvain se hizo dibujar líneas que imitan músculos en el lado derecho.","Sylvain se tatuó insectos porque estos animales están desapareciendo.","Para Sylvain, las operaciones son cada vez menos dolorosas.","Sylvain cree que un día dejará de tatuarse."],["Tuvo una mala caída en bici.","Este accidente le dejó una enorme cicatriz.","Para una especialista en escenas de riesgo, una lesión puede significar una baja laboral.","Para los artistas, la disminución de las capacidades físicas es un sufrimiento psicológico.","Ya he tenido dos fracturas, una patinando y la otra cayéndome de la silla.","Recibió una patada durante el combate…","…pero aguantó el golpe."],["Soy Théo Curin, veintiún años, amputado de las cuatro extremidades…","…bien de cabeza, bien en mi piel.","…bien de cabeza, bien en mi piel.","Cuando me preguntan cómo reaccionaría si me devolvieran los brazos y las piernas…","…si me devolvieran los brazos y las piernas, respondo: «No, gracias».","Ante nuestros ojos, Théo encaja los golpes, se levanta, rebota…","Ante nuestros ojos, Théo encaja los golpes, se levanta, rebota, se relanza…","Cuenta los fracasos que supera…","…y los retos que afronta."],["¿Qué enfermedad tuvo Théo Curin?","¿A qué edad?","¿Qué consecuencias tuvo en su cuerpo?","¿Lamenta Théo su discapacidad?"],["En cuanto los campos y los balones hayan evolucionado (evolucionar), el fútbol y el baloncesto se jugarán en tres dimensiones.","En cuanto los campos y los balones hayan evolucionado, el fútbol y el baloncesto se jugarán (jugarse) en tres dimensiones.","Una vez que los cíborgs hayan participado (participar) en los JJ. OO., se abrirá un debate mundial sobre el lugar de las tecnologías en el deporte.","Una vez que los cíborgs hayan participado en los JJ. OO., se abrirá (abrirse) un debate mundial sobre el lugar de las tecnologías en el deporte.","En cuanto esta nadadora haya batido (batir) el récord del mundo, querrá lanzarse nuevos retos.","En cuanto esta atleta haya batido el récord del mundo, querrá (querer) lanzarse nuevos retos."],["¿Sabes que el 56 % de los deportistas franceses han cambiado (cambiar) sus hábitos por el cambio climático?","He leído (leer) un artículo sobre el deporte en 2050.","Se prevé que para esa fecha más del 30 % de los corredores habrán adaptado (adaptar) sus horarios…","…y que habrán modificado (modificar) sus recorridos.","¿Ah, sí     function qEs(l, i, j) {

    function renderCard(card, lesson, idx) {

            } else {
                const w = Math.max(70, Math.min(280, Math.max(...it.a.map(a => a.length)) * 10 + 24));
                const parts = it.t.split('___');
                html += (it.say ? sayBtn(it.say) : '') + esc(parts[0]) +
                    `<input class="lb-gap" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:${w}px">` +
                    esc(parts[1] || '') + '<span class="lb-fix"></span>' + esHtml;
            }
            html += '</div>';
        });
        html += '<div class="lb-actions">';

        html += '<button class="lb-btn lb-rst">Recommencer</button></div>';
        card.innerHTML = html;

        const scoreEl = card.querySelector('.lb-score');

                    if (!ok) b.classList.add('bad');

            });
        } else {
            const inputs = [...card.querySelectorAll('.lb-gap')];

            const mark1 = (inp, j, showSol) => {

            const live = () => {

            inputs.forEach(inp => {
                inp.addEventListener('change', live);
                inp.addEventListener('input', () => { inp.classList.remove('ok', 'bad'); inp.parentElement.querySelector('.lb-fix').textContent = ''; });
            });
            card.querySelector('.lb-chk').onclick = check;
            card.querySelector('.lb-sol').onclick = () => inputs.forEach((inp, j) => mark1(inp, j, true));
            inputs.forEach((inp, j) => inp.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); if (inputs[j + 1]) inputs[j + 1].focus(); else check(); }
            }));
        }
    }

    window.lbPrint = function () {
        showIndex(false);
        document.getElementById('lbSearch').value = '';
        setTimeout(() => window.print(), 50);
    };
    initIndex();
    openLesson(curLesson, false);
})();
</script>

</body>
